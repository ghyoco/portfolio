<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="PathFinder preview: real-time lane detection on a road view">
  <rect width="1200" height="675" fill="#f4f4f5" />

  <!-- window -->
  <rect x="56" y="44" width="1088" height="587" rx="16" fill="#ffffff" stroke="#e4e4e7" />
  <line x1="56" y1="92" x2="1144" y2="92" stroke="#e4e4e7" />
  <circle cx="88" cy="68" r="6" fill="#ea580c" />
  <circle cx="110" cy="68" r="6" fill="#e4e4e7" />
  <circle cx="132" cy="68" r="6" fill="#e4e4e7" />
  <rect x="170" y="56" width="360" height="24" rx="12" fill="#f4f4f5" />
  <text x="186" y="73" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#71717a">pathfinder.local/stream</text>

  <!-- road scene -->
  <g>
    <rect x="120" y="140" width="960" height="380" rx="10" fill="#e7e5e4" />
    <rect x="120" y="140" width="960" height="120" rx="10" fill="#f5f5f4" />
    <!-- sky/ground split -->
    <line x1="120" y1="252" x2="1080" y2="252" stroke="#d6d3d1" />
    <!-- road surface -->
    <path d="M120 520 L380 252 L820 252 L1080 520 Z" fill="#57534e" />
    <!-- lane markers (perspective) -->
    <g stroke="#f5f5f4" stroke-width="4" stroke-dasharray="18 14">
      <line x1="590" y1="252" x2="540" y2="520" />
      <line x1="612" y1="252" x2="740" y2="520" />
    </g>
    <line x1="600" y1="252" x2="640" y2="520" stroke="#f5f5f4" stroke-width="5" />
    <!-- detected lane curves (accent) -->
    <g fill="none" stroke="#ea580c" stroke-width="6" stroke-linecap="round">
      <path d="M410 252 Q 400 390 470 520" />
      <path d="M790 252 Q 830 390 810 520" />
    </g>
    <!-- sliding window boxes -->
    <g fill="none" stroke="#ea580c" stroke-width="2" opacity="0.65">
      <rect x="398" y="270" width="60" height="42" rx="4" />
      <rect x="402" y="336" width="66" height="44" rx="4" />
      <rect x="420" y="404" width="74" height="46" rx="4" />
      <rect x="768" y="270" width="60" height="42" rx="4" />
      <rect x="782" y="336" width="66" height="44" rx="4" />
      <rect x="774" y="404" width="74" height="46" rx="4" />
    </g>
    <!-- BEV inset -->
    <g>
      <rect x="920" y="160" width="200" height="150" rx="8" fill="#ffffff" stroke="#e4e4e7" />
      <path d="M1010 175 L950 295 L1070 295 Z" fill="#57534e" />
      <path d="M1010 180 L962 292" stroke="#ea580c" stroke-width="4" fill="none" />
      <path d="M1010 180 L1058 292" stroke="#ea580c" stroke-width="4" fill="none" />
      <text x="936" y="300" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#a1a1aa">BEV</text>
    </g>
  </g>

  <!-- readout chip -->
  <g>
    <rect x="380" y="548" width="440" height="44" rx="10" fill="#ffffff" stroke="#e4e4e7" />
    <circle cx="406" cy="570" r="5" fill="#ea580c" />
    <text x="422" y="575" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#09090b">lane drift 0.4° · day/night stable</text>
  </g>
</svg>
