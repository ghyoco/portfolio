<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Energy forecasting preview: predicted vs actual power load curves">
  <rect width="1200" height="675" fill="#f4f4f5" />

  <!-- window -->
  <rect x="56" y="44" width="1088" height="587" rx="16" fill="#ffffff" stroke="#e4e4e7" />
  <line x1="56" y1="92" x2="1144" y2="92" stroke="#e4e4e7" />
  <circle cx="88" cy="68" r="6" fill="#ea580c" />
  <circle cx="110" cy="68" r="6" fill="#e4e4e7" />
  <circle cx="132" cy="68" r="6" fill="#e4e4e7" />
  <rect x="170" y="56" width="360" height="24" rx="12" fill="#f4f4f5" />
  <text x="186" y="73" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#71717a">forecast.local/cu-bems/load-30min</text>

  <!-- chart frame -->
  <g>
    <rect x="120" y="140" width="960" height="380" rx="10" fill="#fafafa" stroke="#e4e4e7" />
    <!-- grid -->
    <g stroke="#e4e4e7" stroke-width="1">
      <line x1="120" y1="215" x2="1080" y2="215" />
      <line x1="120" y1="290" x2="1080" y2="290" />
      <line x1="120" y1="365" x2="1080" y2="365" />
      <line x1="120" y1="440" x2="1080" y2="440" />
    </g>
    <!-- actual load curve (gray) -->
    <path d="M120 420 C 180 340, 230 300, 290 330 S 400 440, 470 410 S 580 260, 650 240 S 760 330, 830 310 S 960 240, 1080 260"
      fill="none" stroke="#a1a1aa" stroke-width="3" />
    <!-- predicted load curve (accent) -->
    <path d="M120 425 C 180 350, 235 305, 292 333 S 405 445, 472 412 S 583 265, 652 244 S 762 335, 832 312 S 962 245, 1080 265"
      fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 6" />
    <!-- train/val split line -->
    <line x1="700" y1="150" x2="700" y2="510" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="712" y="166" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#71717a">TimeSeriesSplit</text>
    <!-- y label -->
    <text x="136" y="168" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#a1a1aa">kW</text>
  </g>

  <!-- legend -->
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13">
    <line x1="330" y1="570" x2="370" y2="570" stroke="#a1a1aa" stroke-width="3" />
    <text x="378" y="575" fill="#3f3f46">actual</text>
    <line x1="480" y1="570" x2="520" y2="570" stroke="#ea580c" stroke-width="3" stroke-dasharray="8 6" />
    <text x="528" y="575" fill="#3f3f46">predicted · R² 0.9818</text>
  </g>
</svg>
